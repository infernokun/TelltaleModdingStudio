name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build native engine (enables end-to-end integration tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
          make -C engine/ttarchext

      - name: Build
        run: dotnet build TelltaleModding.sln --configuration Release

      - name: Test
        run: dotnet test tests/TelltaleModding.Core.Tests --configuration Release --no-build

  publish-windows:
    runs-on: windows-latest
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/TelltaleModding.App -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -o publish

      - name: Bundle engine
        run: Copy-Item -Recurse engine publish/engine

      - uses: actions/upload-artifact@v4
        with:
          name: TelltaleModdingStudio-win-x64
          path: publish/
